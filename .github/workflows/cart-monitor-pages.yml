name: Publish CART monitor
on:
  push:
    branches: [main]
    paths:
      - 'web/cart-monitor-site/**'
      - '.github/workflows/cart-monitor-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cart-monitor-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Check worker and build static dashboard
        run: |
          node web/cart-monitor-site/scripts/test-worker.mjs
          node web/cart-monitor-site/scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy monitor
        id: deployment
        uses: actions/deploy-pages@v4
